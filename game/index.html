<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a duel of cunning and cinders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: #f3e9d2;
    background: #120806;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #table {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: 10px 22px 12px;
    background:
      radial-gradient(ellipse 90% 70% at 50% 42%, rgba(122, 47, 22, .55), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  /* ---------- header ---------- */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 8px; border-bottom: 1px solid rgba(212, 175, 105, .35);
  }
  .brand {
    font-size: 20px; letter-spacing: 4px; font-weight: bold;
    color: #e8c877; text-shadow: 0 0 18px rgba(232, 200, 119, .45), 0 2px 4px #000;
  }
  .duel-tag { font-size: 15px; font-style: italic; color: #d8c49a; }
  .score-box { display: flex; align-items: baseline; gap: 8px; }
  .score-label { font-size: 11px; letter-spacing: 3px; color: #b99b5e; }
  .score-value {
    font-size: 26px; font-weight: bold; color: #ffd97a;
    text-shadow: 0 0 14px rgba(255, 217, 122, .5);
  }
  /* ---------- enemy ---------- */
  #enemy-area {
    display: flex; align-items: center; gap: 18px; padding: 10px 6px 4px;
    min-height: 118px;
  }
  .portrait {
    width: 84px; height: 84px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #f59e0b, #7c2d12 65%, #3f1305);
    border: 3px solid #d4af69;
    box-shadow: 0 0 26px rgba(245, 158, 11, .45), inset 0 0 18px rgba(0,0,0,.55);
    color: #ffe9b0;
  }
  .portrait svg { width: 46px; height: 46px; }
  .side-info { min-width: 300px; }
  .side-name { font-size: 22px; font-weight: bold; color: #ffe9b0; text-shadow: 0 2px 6px #000; }
  .side-title { font-size: 13px; font-style: italic; color: #c9a86a; margin-bottom: 5px; }
  .hpbar {
    position: relative; width: 320px; height: 22px; border-radius: 11px;
    background: rgba(0,0,0,.6); border: 1px solid rgba(212,175,105,.5);
    overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,.7);
  }
  .hpfill { height: 100%; border-radius: 10px; transition: width .45s ease; }
  .hplabel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000;
  }
  .badges { display: flex; gap: 8px; margin-top: 5px; min-height: 22px; }
  .badge {
    font-size: 13px; font-weight: bold; padding: 2px 9px; border-radius: 11px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .badge.block { background: rgba(37, 99, 235, .85); color: #dbeafe; box-shadow: 0 0 10px rgba(59,130,246,.5); }
  .badge.burn { background: rgba(234, 88, 12, .9); color: #ffedd5; box-shadow: 0 0 10px rgba(249,115,22,.5); }
  .enemy-hand { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .deck-count { font-size: 12px; color: #b99b5e; font-style: italic; margin-left: 6px; white-space: nowrap; }
  /* ---------- centre ---------- */
  #center-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 2px 0;
  }
  .log-line { font-size: 16px; font-style: italic; color: #e7d6ae; text-shadow: 0 1px 3px #000; min-height: 20px; text-align: center; }
  .last-play {
    font-size: 14px; padding: 4px 14px; border-radius: 14px; max-width: 640px; text-align: center;
    font-family: 'Segoe UI', system-ui, sans-serif; background: rgba(0,0,0,.45);
    border: 1px solid rgba(212,175,105,.4);
  }
  .last-play.enemy { border-color: rgba(239, 68, 68, .6); color: #fecaca; }
  .end-turn {
    font-family: Georgia, serif; font-size: 18px; font-weight: bold; letter-spacing: 1px;
    color: #1a0b06; background: linear-gradient(180deg, #f6d789, #d4af69 55%, #a97e2f);
    border: 1px solid #f6d789; border-radius: 24px; padding: 10px 30px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.6), 0 0 22px rgba(212,175,105,.35);
  }
  .end-turn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .hint { font-size: 12.5px; color: #a98f5f; font-style: italic; text-align: center; max-width: 700px; }
  /* ---------- player ---------- */
  #player-area { display: flex; align-items: center; gap: 20px; padding: 2px 6px 6px; }
  .player-info { min-width: 340px; }
  .mana { display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .gem {
    width: 20px; height: 20px; transform: rotate(45deg); border-radius: 4px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(147, 197, 253, .4);
  }
  .gem.full {
    background: linear-gradient(135deg, #7dd3fc, #2563eb);
    box-shadow: 0 0 12px rgba(56, 189, 248, .8); border-color: #bae6fd;
  }
  .mana-label { font-size: 14px; color: #93c5fd; margin-left: 8px; font-family: 'Segoe UI', system-ui, sans-serif; }
  /* ---------- hand & cards ---------- */
  #hand-area { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 216px; }
  .hand { display: flex; gap: 10px; align-items: flex-end; padding-bottom: 16px; }
  .card {
    --ca: #7f1d1d; --cb: #dc2626; --cac: #fca5a5; --cglow: rgba(239,68,68,.55);
    width: 138px; height: 198px; flex: none; border-radius: 12px; position: relative;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%),
      linear-gradient(165deg, var(--ca), var(--cb) 70%, var(--ca));
    border: 2px solid rgba(232, 200, 119, .85);
    box-shadow: 0 8px 22px rgba(0,0,0,.65), inset 0 0 0 1px rgba(0,0,0,.35), inset 0 -14px 26px rgba(0,0,0,.35);
    transform: rotate(var(--tilt, 0deg)) translateY(var(--lift, 0px));
    transform-origin: bottom center;
    transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    cursor: default; user-select: none; overflow: hidden;
  }
  .card::after {
    content: ''; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%);
  }
  .card.playable { cursor: pointer; }
  .card.playable:hover {
    transform: rotate(var(--tilt, 0deg)) translateY(-26px) scale(1.06);
    box-shadow: 0 18px 34px rgba(0,0,0,.75), 0 0 26px var(--cglow);
    z-index: 5;
  }
  .card:not(.playable) { filter: saturate(.45) brightness(.72); }
  .card .cost {
    position: absolute; top: 7px; left: 7px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: bold; color: #fff;
    background: radial-gradient(circle at 35% 30%, #60a5fa, #1d4ed8 70%);
    border: 2px solid #bfdbfe; box-shadow: 0 2px 8px rgba(0,0,0,.6);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .card-name {
    margin: 10px 8px 0 44px; font-size: 14.5px; font-weight: bold; line-height: 1.1;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); min-height: 32px;
  }
  .card-art {
    margin: 2px auto 0; width: 96px; height: 74px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.28), rgba(0,0,0,.28) 75%);
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: inset 0 0 14px rgba(0,0,0,.35);
    color: var(--cac);
  }
  .card-art svg { width: 52px; height: 52px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .card-stats {
    display: flex; gap: 6px; justify-content: center; margin-top: 7px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: bold;
  }
  .card-stats .stat { background: rgba(0,0,0,.45); border-radius: 9px; padding: 1px 7px; color: #fff; }
  .card-text {
    margin: 7px 10px 0; font-size: 12.5px; line-height: 1.25; text-align: center;
    color: rgba(255,255,255,.92); font-style: italic; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .card.back {
    width: 52px; height: 76px; border-radius: 7px; cursor: default;
    background:
      repeating-linear-gradient(45deg, rgba(212,175,105,.16) 0 6px, rgba(0,0,0,0) 6px 12px),
      linear-gradient(165deg, #5b1a08, #2a0d04);
    border: 2px solid rgba(212,175,105,.7);
    box-shadow: 0 4px 12px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transform: none;
  }
  .back-emblem { font-size: 20px; color: #d4af69; line-height: 1; }
  .back-word { font-size: 7px; letter-spacing: 1.5px; color: #b99b5e; text-align: center; line-height: 1.4; }
  /* ---------- overlays ---------- */
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8, 3, 1, .62); z-index: 20; backdrop-filter: blur(2px);
  }
  #overlay.show { display: flex; }
  .panel {
    width: 620px; max-width: 92vw; border-radius: 18px; padding: 30px 38px 26px; text-align: center;
    background: linear-gradient(170deg, rgba(66, 26, 10, .97), rgba(24, 8, 3, .97) 70%);
    border: 2px solid #d4af69;
    box-shadow: 0 24px 70px rgba(0,0,0,.8), 0 0 44px rgba(212,175,105,.25), inset 0 0 40px rgba(0,0,0,.4);
  }
  .crown-big { font-size: 52px; color: #e8c877; text-shadow: 0 0 26px rgba(232,200,119,.7); line-height: 1; }
  .crown-big.dim { color: #6b5a3a; text-shadow: none; }
  .game-title {
    font-size: 44px; letter-spacing: 6px; color: #ffe9b0; margin: 6px 0 4px;
    text-shadow: 0 0 24px rgba(255, 217, 122, .5), 0 3px 6px #000;
  }
  .tagline { font-size: 16px; font-style: italic; color: #d8c49a; margin-bottom: 16px; }
  .rules {
    text-align: left; font-size: 14.5px; line-height: 1.55; color: #eadfc2;
    background: rgba(0,0,0,.35); border: 1px solid rgba(212,175,105,.35);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .big-btn {
    font-family: Georgia, serif; font-size: 20px; font-weight: bold; letter-spacing: 1px;
    color: #1a0b06; background: linear-gradient(180deg, #f6d789, #d4af69 55%, #a97e2f);
    border: 1px solid #f6d789; border-radius: 26px; padding: 13px 34px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.6), 0 0 26px rgba(212,175,105,.4);
  }
  .big-btn:hover { filter: brightness(1.12); }
  .fine { margin-top: 12px; font-size: 12px; color: #8f7a52; font-style: italic; }
  .stats {
    display: grid; grid-template-columns: auto auto; gap: 6px 26px; justify-content: center;
    margin: 4px 0 20px; font-size: 16px;
  }
  .stat-k { color: #c9a86a; text-align: right; }
  .stat-v { color: #ffd97a; font-weight: bold; text-align: left; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="table">
  <div id="header"></div>
  <div id="enemy-area"></div>
  <div id="center-area"></div>
  <div id="player-area"></div>
  <div id="hand-area"></div>
</div>
<div id="overlay"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
